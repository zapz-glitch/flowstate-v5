name: evaluation-v4-candidate

# Candidate-only CI for the V4 evaluation runtime. This workflow builds and
# checks the candidate; it never deploys, never touches production config,
# never calls external providers, and never publishes images. Production
# deploys stay in .github/workflows/deploy.yml (main only).

on:
  push:
    branches:
      - v4-python
      - feature/v4-python-eval-swap
      - v4/runtime-ci
      - v4/integration-runtime
      - v4/python-fast-eval
  pull_request:
    paths:
      - compose.dev.yaml
      - .dockerignore
      - package.json
      - package-lock.json
      - turbo.json
      - scripts/runtime
      - scripts/secret-scan
      - services/eval-engine/**
      - apps/api/**
      - apps/dashboard/**
      - packages/shared/**
      - docs/eval-v4/RUNTIME.md
      - docs/eval-v4/WORKER_RUNTIME.md
      - .github/workflows/evaluation-v4-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-checks:
    name: candidate checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: v4test
          POSTGRES_PASSWORD: v4testpw
          POSTGRES_DB: v4test
        options: >-
          --health-cmd "pg_isready -U v4test -d v4test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 55440:5432
    steps:
      - name: Checkout # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install engine dependencies (authoritative hashed lock, includes Alembic for post-V4-102 migrations)
        working-directory: services/eval-engine
        run: pip install --require-hashes -r requirements.txt

      - name: Verify Alembic available (post-V4-102 migration readiness)
        working-directory: services/eval-engine
        run: python -c "import alembic; print('alembic', alembic.__version__)"

      - name: Install JS dependencies (locked)
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run V4 Python tests
        working-directory: services/eval-engine
        run: PYTHONPATH=src python -m pytest tests -q

      - name: Secret scan (tracked and untracked files)
        run: ./scripts/secret-scan

      - name: Build-context sentinel check (env/tsbuildinfo/logs excluded, sources preserved)
        run: |
          set -eu
          printf 'PROBE\n' > .env.sentinel-probe
          printf 'PROBE\n' > probe-sentinel.log
          printf 'PROBE\n' > services/eval-engine/.env.sentinel-probe
          printf 'PROBE\n' > services/eval-engine/probe-sentinel.log
          printf 'PROBE\n' > apps/dashboard/tsconfig.probe.tsbuildinfo
          trap 'rm -f .env.sentinel-probe probe-sentinel.log services/eval-engine/.env.sentinel-probe services/eval-engine/probe-sentinel.log apps/dashboard/tsconfig.probe.tsbuildinfo' EXIT
          printf 'FROM busybox\nCOPY . /ctx\nRUN test ! -e /ctx/.env.sentinel-probe && test ! -e /ctx/probe-sentinel.log && test ! -e /ctx/apps/dashboard/tsconfig.probe.tsbuildinfo && test -f /ctx/package.json && test -d /ctx/apps/dashboard/src && test -d /ctx/packages/shared && echo "ROOT CONTEXT SENTINEL PASS"\n' > /tmp/root-sentinel.Dockerfile
          docker build --no-cache -f /tmp/root-sentinel.Dockerfile . --progress=plain 2>&1 | grep -q "ROOT CONTEXT SENTINEL PASS"
          printf 'FROM busybox\nCOPY . /ctx\nRUN test ! -e /ctx/.env.sentinel-probe && test ! -e /ctx/probe-sentinel.log && test -f /ctx/.env.example && test -f /ctx/requirements.txt && test -d /ctx/src && echo "ENGINE CONTEXT SENTINEL PASS"\n' > /tmp/engine-sentinel.Dockerfile
          docker build --no-cache -f /tmp/engine-sentinel.Dockerfile services/eval-engine --progress=plain 2>&1 | grep -q "ENGINE CONTEXT SENTINEL PASS"

      - name: Validate isolated Compose config
        run: docker compose --project-name flowstate-v4-dev -f compose.dev.yaml config

      - name: Build candidate images (no push, no deploy)
        run: docker compose --project-name flowstate-v4-dev -f compose.dev.yaml build

      - name: Migrate isolated PG from the built image
        run: |
          set -eu
          docker run --rm --network host \
            -e DATABASE_URL="postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test" \
            flowstate-v4-dev-api:local alembic upgrade head

      - name: Verify revision and required tables
        working-directory: services/eval-engine
        env:
          DATABASE_URL: postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          with engine.connect() as conn:
              revision = conn.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert revision == "0004_v4_provider_limiter", revision
          tables = set(inspect(engine).get_table_names())
          required = {"v4_settings_snapshots", "v4_batches", "v4_evaluations", "v4_evaluation_results", "v4_result_snapshot_backfill", "v4_cotality_leases", "v4_cotality_calls"}
          missing = sorted(required - tables)
          assert not missing, f"missing tables: {missing}"
          print(f"revision {revision}; required tables present")
          PY

      - name: Start API and verify readiness
        run: |
          set -euo pipefail
          docker run -d --rm --name v4-ci-api --network host \
            -e PORT=8004 \
            -e DATABASE_URL="postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test" \
            -e V4_INTERNAL_API_TOKEN=candidate-local-only \
            -e V4_EXTERNAL_CALLS_ENABLED=false \
            -e V4_TEST_PROFILE=false \
            flowstate-v4-dev-api:local \
            uvicorn eval_engine.main:app --host 127.0.0.1 --port 8004 --app-dir src
          trap 'docker rm -f v4-ci-worker v4-ci-api >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8004/health/ready | grep -q '"ready":true'; then
              curl -fsS http://127.0.0.1:8004/health/ready
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8004/health/ready | grep -q '"ready":true'

      - name: Worker smoke processes a known stubbed batch (tenant+user)
        run: |
          set -euo pipefail
          # --max-jobs N means: process at most N claimed evaluations per
          # run. Product main.py clamps N<1 to 1
          # (worker._config.max_jobs = max(1, int(args.max_jobs))), so a
          # bare --max-jobs 0/negative invocation would silently become a
          # 1-job run detached from any submitted batch and must never be
          # used as a smoke signal. This step submits one known
          # preloaded stub evaluation, runs the real worker binary with
          # --max-jobs 1, and verifies a persisted terminal 1/1 result.
          #
          # `docker run` needs `-i` so the `python - <<'PY'` heredoc on
          # stdin actually reaches the container; without `-i` the
          # script is silently dropped and the step passes vacuously.
          trap 'docker rm -f v4-ci-worker v4-ci-api >/dev/null 2>&1 || true' EXIT
          SUBMIT_OUT=$(docker run --rm -i --network host \
            -e DATABASE_URL="postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test" \
            flowstate-v4-dev-api:local \
            python - <<'PY'
          import uuid
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          from eval_engine.application.service import submit_batch
          from eval_engine.contracts.settings import (
              RenovationTierCellV4,
              RenovationTierV4,
              SettingsSnapshotV4,
          )
          levels = ["lipstick", "light_cosmetic", "full_cosmetic", "heavy_rehab", "full_gut"]
          def cells():
              return [RenovationTierCellV4(renovation_level=lv, rehab_rate_per_sqft="100", flip_profit="50000") for lv in levels]
          tiers = [
              RenovationTierV4(tier_key="under500k", lower_inclusive="0", upper_exclusive="500000", cells=cells()),
              RenovationTierV4(tier_key="500k_to_under1m", lower_inclusive="500000", upper_exclusive="1000000", cells=cells()),
              RenovationTierV4(tier_key="1m_to_3m", lower_inclusive="1000000", upper_inclusive="3000000", cells=cells()),
              RenovationTierV4(tier_key="over3m", lower_exclusive="3000000", cells=cells()),
          ]
          settings = SettingsSnapshotV4(snapshot_id="snap-1", tiers=[], deal={}, transaction_rule={})
          payload = settings.model_dump(mode="json")
          payload["tiers"] = [t.model_dump(mode="json") for t in tiers]
          def comps():
              return [{"comp_id": f"c{k}", "verified_sale_price": str(600000 - k * 10000),
                       "sale_date": "2026-06-01", "sqft": "2000",
                       "evidence_ref": f"ev-{k}", "is_sale": True} for k in range(1, 4)]
          body = {"settings": payload, "candidate_evidence_mode": "preloaded",
                  "evaluations": [{"idempotency_key": "ci-smoke-0",
                                    "subject": {"address": "1 Main St", "city": "Austin", "state": "TX", "sqft": "2000"},
                                    "comps": comps(), "renovation_level": "light_cosmetic",
                                    "evaluation_date": "2026-09-01"}]}
          mk = sessionmaker(bind=create_engine("postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test"))
          with mk() as s:
              batch, created, summaries = submit_batch(
                  s, tenant_id="ci-smoke", requested_by_user_id="ci-user",
                  batch_key="ci-smoke-batch-001", body=body)
              s.commit()
              assert created and len(summaries) == 1
              print(str(batch.id))
          PY
          )
          echo "submitted batch ${SUBMIT_OUT}"
          test -n "${SUBMIT_OUT}"
          case "${SUBMIT_OUT}" in
            *"-"*"-"*"-"*"-"*) : ;;
            *) echo "worker smoke FAILED: submission did not print a batch id" >&2; exit 1 ;;
          esac
          docker run --rm --name v4-ci-worker --network host \
            -e DATABASE_URL="postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test" \
            -e V4_WORKER_TENANT=ci-smoke \
            -e V4_WORKER_OWNER=worker:ci \
            -e V4_WORKER_USER=ci-user \
            -e V4_EXTERNAL_CALLS_ENABLED=false \
            flowstate-v4-dev-api:local \
            python -m eval_engine.worker.main --max-jobs 1
          docker run --rm -i --network host \
            -e DATABASE_URL="postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test" \
            -e EXPECTED_BATCH="${SUBMIT_OUT}" \
            flowstate-v4-dev-api:local \
            python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = "postgresql+psycopg://v4test:v4testpw@127.0.0.1:55440/v4test"
          engine = create_engine(url)
          with engine.connect() as conn:
              row = conn.execute(
                  text("SELECT status, total_count, succeeded_count FROM v4_batches WHERE id = :bid"),
                  {"bid": os.environ["EXPECTED_BATCH"]},
              ).one()
              assert tuple(row) == ("succeeded", 1, 1), tuple(row)
              evals = conn.execute(
                  text("SELECT status, count(*) FROM v4_evaluations WHERE batch_id = :bid GROUP BY status"),
                  {"bid": os.environ["EXPECTED_BATCH"]},
              ).all()
              assert [(r[0], r[1]) for r in evals] == [("succeeded", 1)], evals
              print(f"worker smoke PASS: batch {os.environ['EXPECTED_BATCH']} succeeded 1/1")
          PY
          docker rm -f v4-ci-api >/dev/null 2>&1 || true
          trap - EXIT
