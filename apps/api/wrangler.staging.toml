name = "flowstate-v4-staging-api"
account_id = "52e4db30ec50dcb20a46c30a0a8da3d4"
main = "src/index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "api.staging.flowstate.homes"
custom_domain = true

[vars]
ENVIRONMENT = "staging"
DASHBOARD_URL = "https://staging.flowstate.homes"
PROPERTY_PROVIDER = "corelogic"

[[d1_databases]]
binding = "DB"
database_name = "flowstate-v4-staging-app"
database_id = "13de78d5-6d02-452a-9101-82cfff4299ed"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "API_CACHE"
id = "1846bfcab8444b198a38a5fd068f8550"

[[r2_buckets]]
binding = "REPORT_ASSETS"
bucket_name = "flowstate-v4-staging-report-assets"

[[durable_objects.bindings]]
name = "ANALYSIS_JOB"
class_name = "AnalysisJobDO"

[[durable_objects.bindings]]
name = "BATCH_JOB"
class_name = "BatchJobDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT_COORDINATOR"
class_name = "RateLimitCoordinatorDO"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AnalysisJobDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["BatchJobDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitCoordinatorDO"]
