# Local emulation only. Never pass this file to wrangler deploy.
name = "flowstate-api"
main = "src/index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "127.0.0.1"
port = 8787

[vars]
ENVIRONMENT = "development"
DASHBOARD_URL = "http://localhost:3000"
PROPERTY_PROVIDER = "corelogic"
# Devin org for offer-workflow session messages
DEVIN_ORG_ID = "org-6c0122ecb67544ccb259ae9b1e9cc4dc"
# Comp price classifier v2 in shadow mode locally (matches wrangler.toml):
# Baseline A routes comps; v2 records alongside. Set "true" to promote v2.
JEV_COMP_CLASSIFIER_V2_ENABLED = "false"
# Three-layer comp screen in shadow mode locally (matches wrangler.toml):
# screen picks + counterfactual valuation recorded; production unchanged.
JEV_ATTRIBUTE_SCREEN_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "flowstate-api-db"
database_id = "106d2645-8ec1-4ae9-8f72-7563ba8aa93f"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "API_CACHE"
id = "076d6c5a242c4b5d9765d04b8b8755b6"

[[r2_buckets]]
binding = "REPORT_ASSETS"
bucket_name = "flowstate-v4-local-report-assets"

# Workers AI — Clef decision models. AI can't run under --local, so the
# binding proxies to the real account (wrangler OAuth covers it).
[ai]
binding = "AI"
remote = true

[[durable_objects.bindings]]
name = "ANALYSIS_JOB"
class_name = "AnalysisJobDO"

[[durable_objects.bindings]]
name = "BATCH_JOB"
class_name = "BatchJobDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT_COORDINATOR"
class_name = "RateLimitCoordinatorDO"

[[migrations]]
tag = "v5"
new_classes = ["AnalysisJobDO"]

[[migrations]]
tag = "v6"
new_classes = ["BatchJobDO"]

[[migrations]]
tag = "v3"
new_classes = ["RateLimitCoordinatorDO"]

# Basin lake — analysis outcomes → Iceberg on flowstate-data-lake
[[pipelines]]
stream = "adbb75b369b645cc930401161827d832"
binding = "FLOWSTATE_ANALYSIS_EVENTS_STREAM"
