name = "flowstate-api"
main = "src/index.ts"

compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8787

[vars]
ENVIRONMENT = "production"
DASHBOARD_URL = "https://flowstate.homes"
PROPERTY_PROVIDER = "corelogic"
# Comparable candidate-pool size — system config, NOT an owner Appraisal
# Rule. CoreLogic maxComps documented max is 100 (no pagination).
COMPARABLE_CANDIDATE_LIMIT = "100"
# Radius for the single provider refetch when the appraisal expansion ladder
# reaches beyond the fetched radius (default: radius x 2).
COMPARABLE_EXPANSION_RADIUS_MILES = "2"
# CDARV learning service (Render) — session-auth /cdarv/* routes proxy here.
# Shadow-only: never called by production valuation paths.
CDARV_API_URL = "https://flowstate-cdarv-prod.onrender.com"

[[d1_databases]]
binding = "DB"
database_name = "flowstate-api-db"
database_id = "106d2645-8ec1-4ae9-8f72-7563ba8aa93f"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "API_CACHE"
id = "076d6c5a242c4b5d9765d04b8b8755b6"

[[r2_buckets]]
binding = "REPORT_ASSETS"
bucket_name = "flowstate-report-assets"

[[durable_objects.bindings]]
name = "ANALYSIS_JOB"
class_name = "AnalysisJobDO"

[[durable_objects.bindings]]
name = "BATCH_JOB"
class_name = "BatchJobDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT_COORDINATOR"
class_name = "RateLimitCoordinatorDO"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AnalysisJobDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["BatchJobDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitCoordinatorDO"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via wrangler secret put):
# CoreLogic API
# - CORELOGIC_CLIENT_ID
# - CORELOGIC_CLIENT_SECRET
#
# OpenRouter LLM (for vision analysis)
# - OPENROUTER_API_KEY
# - OPENROUTER_MODEL (optional, defaults to google/gemini-2.0-flash-001)
#
# Dashboard Integration (shared secret for session-based auth)
# - DASHBOARD_INTERNAL_SECRET

# Cron: sweeps dead/stuck batch jobs so lists run unattended to completion
[triggers]
crons = ["*/5 * * * *"]
