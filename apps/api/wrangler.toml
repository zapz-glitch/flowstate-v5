name = "flowstate-api"
main = "src/index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8787

[vars]
ENVIRONMENT = "production"
DASHBOARD_URL = "https://app.flowstate.homes"
PROPERTY_PROVIDER = "corelogic"

[[d1_databases]]
binding = "DB"
database_name = "flowstate-api-db"
database_id = "106d2645-8ec1-4ae9-8f72-7563ba8aa93f"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "API_CACHE"
id = "076d6c5a242c4b5d9765d04b8b8755b6"

[[durable_objects.bindings]]
name = "ANALYSIS_JOB"
class_name = "AnalysisJobDO"

[[durable_objects.bindings]]
name = "BATCH_JOB"
class_name = "BatchJobDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT_COORDINATOR"
class_name = "RateLimitCoordinatorDO"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AnalysisJobDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["BatchJobDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitCoordinatorDO"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via wrangler secret put):
# CoreLogic API
# - CORELOGIC_CLIENT_ID
# - CORELOGIC_CLIENT_SECRET
#
# OpenRouter LLM (for vision analysis)
# - OPENROUTER_API_KEY
# - OPENROUTER_MODEL (optional, defaults to google/gemini-2.0-flash-001)
#
# Dashboard Integration (shared secret for session-based auth)
# - DASHBOARD_INTERNAL_SECRET
