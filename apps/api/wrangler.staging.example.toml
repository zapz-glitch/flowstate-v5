name = "flowstate-v4-staging-api"
main = "src/index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "api.staging.flowstate.homes"
custom_domain = true

[vars]
ENVIRONMENT = "staging"
DASHBOARD_URL = "https://staging.flowstate.homes"
PROPERTY_PROVIDER = "corelogic"
EVALUATION_ENGINE = "python-v4"
V4_HOSTED_API_URL = "https://flowstate-v4-staging-python.onrender.com"
V4_STAGING_ASSETS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "flowstate-v4-staging-app"
database_id = "REPLACE_WITH_NEW_STAGING_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "API_CACHE"
id = "REPLACE_WITH_NEW_STAGING_KV_ID"

[[r2_buckets]]
binding = "REPORT_ASSETS"
bucket_name = "flowstate-v4-staging-report-assets"

[[durable_objects.bindings]]
name = "ANALYSIS_JOB"
class_name = "AnalysisJobDO"

[[durable_objects.bindings]]
name = "BATCH_JOB"
class_name = "BatchJobDO"

[[migrations]]
tag = "v5"
new_classes = ["AnalysisJobDO"]

[[migrations]]
tag = "v6"
new_classes = ["BatchJobDO"]
