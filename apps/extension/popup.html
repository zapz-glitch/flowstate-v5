<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flowstate</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; color: #e5e5e5; background: #0a0a0a; }
    button { width: 100%; padding: 9px 12px; font-size: 13px; font-weight: 600; background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .hint { font-size: 12px; color: #737373; margin: 8px 0 0; }
    #jobs { list-style: none; margin: 12px 0 0; padding: 0; max-height: 320px; overflow-y: auto; }
    #jobs li { padding: 8px 10px; border: 1px solid #262626; border-radius: 4px; margin-bottom: 6px; cursor: pointer; }
    #jobs li:hover { background: #141414; }
    .address { font-size: 13px; }
    .status { font-size: 12px; margin-top: 2px; color: #a3a3a3; }
    .status.done { color: #4ade80; }
    .status.error { color: #f87171; }
    footer { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; }
    footer a { color: #a3a3a3; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <button id="send">Send this page to Flowstate</button>
  <p class="hint" id="hint"></p>
  <ul id="jobs"></ul>
  <footer>
    <a id="open">Open Flowstate</a>
    <a id="clear">Clear finished</a>
    <a id="options">Settings</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
