# Development-only runtime for the V4 evaluation candidate.
#
# Isolated Compose project "flowstate-v4-dev" (see `name:` below). All host
# ports are loopback-bound so this never touches the shared LAN and stays
# clear of occupied ports (3000/8000/...).
#
# - API 8004 matches services/eval-engine/Dockerfile (EXPOSE/CMD).
# - PostgreSQL is reachable only on the internal candidate network.
# - Dashboard 3004 (host) -> 3000 (container, `next dev` default).
# - The legacy TS API (localhost:8787) is intentionally NOT included: the V4
#   TS bridge is not implemented, so the dashboard keeps its repo-configured
#   API URL and the health check only asserts the dashboard responds.
#
# Managed via ./scripts/runtime (up|down|status|health|logs). Do not point
# production tooling at this file.

name: flowstate-v4-dev

services:
  api:
    build:
      context: ./services/eval-engine
      dockerfile: Dockerfile
    image: flowstate-v4-dev-api:local
    pull_policy: build
    ports:
      - "127.0.0.1:${V4_API_PORT:-8004}:8004"
    environment:
      PORT: "8004"
      TS_API_BASE: "http://127.0.0.1:8787"
      DATABASE_URL: "postgresql+psycopg://flowstate_v4:flowstate_v4_dev@postgres:5432/flowstate_v4"
      V4_INTERNAL_API_TOKEN: "candidate-local-only"
      V4_EXTERNAL_CALLS_ENABLED: "false"
      V4_TEST_PROFILE: "false"
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend

  api-worker:
    build:
      context: ./apps/api
    image: flowstate-v4-dev-api-worker:local
    pull_policy: always
    command: ["wrangler", "dev"]
    environment:
      BETTER_AUTH_SECRET: "test-secret"
      # D1 binding is defined in wrangler.toml; wrangler dev will use local DB if available
    ports:
      - "127.0.0.1:${V4_API_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
  migrate:
    build:
      context: ./services/eval-engine
      dockerfile: Dockerfile
    image: flowstate-v4-dev-api:local
    pull_policy: build
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg://flowstate_v4:flowstate_v4_dev@postgres:5432/flowstate_v4"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: ./services/eval-engine
      dockerfile: Dockerfile
    image: flowstate-v4-dev-api:local
    pull_policy: build
    command: ["python", "-m", "eval_engine.worker.main"]
    environment:
      DATABASE_URL: "postgresql+psycopg://flowstate_v4:flowstate_v4_dev@postgres:5432/flowstate_v4"
      V4_WORKER_TENANT: "${V4_WORKER_TENANT:-default}"
      V4_WORKER_OWNER: "${V4_WORKER_OWNER:-worker:service}"
      V4_WORKER_USER: "${V4_WORKER_USER:-local-dev-user}"
      V4_WORKER_ALLOW_DEFAULT_USER: "true"
      V4_EXTERNAL_CALLS_ENABLED: "false"
      COTALITY_CONCURRENCY: "${COTALITY_CONCURRENCY:-4}"
      COTALITY_RPM: "${COTALITY_RPM:-40}"
      V4_WORKER_LEASE_SECONDS: "${V4_WORKER_LEASE_SECONDS:-300}"
      V4_WORKER_HEARTBEAT_SECONDS: "${V4_WORKER_HEARTBEAT_SECONDS:-30}"
      V4_WORKER_POLL_SECONDS: "${V4_WORKER_POLL_SECONDS:-1}"
    restart: "unless-stopped"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: "flowstate_v4"
      POSTGRES_USER: "flowstate_v4"
      POSTGRES_PASSWORD: "flowstate_v4_dev"
    volumes:
      - v4-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstate_v4 -d flowstate_v4"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.dev
    image: flowstate-v4-dev-dashboard:local
    ports:
      - "127.0.0.1:${V4_DASHBOARD_PORT:-3004}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: "http://localhost:8787"
      NEXT_PUBLIC_FASTAPI_URL: "http://localhost:8004"
    volumes:
      - v4-dashboard-next:/app/apps/dashboard/.next
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
      api-worker:
        condition: service_started
    networks:
      - frontend

volumes:
  v4-postgres-data:
  v4-dashboard-next:

networks:
  frontend:
  backend:
    internal: true
